# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  auto_review:
    # `base_branches` defaults to `[]`, which means CodeRabbit reviews only PRs
    # targeting the default branch. The dashboard migration is a long-lived
    # integration branch collecting stacked PRs that never target `main` until
    # the end, so without this entry the whole stack goes unreviewed, silently.
    # Regex, so one pattern covers any future integration branch.
    base_branches:
      - "^feat/.*-migration$"

    # `skip-review` is the general opt-out: label any PR with it and CodeRabbit
    # stays quiet. The leading `!` negates, so everything else is still
    # reviewed. release.yml applies it automatically to the "chore: version
    # packages" PR.
    labels:
      - "!skip-review"

    # Second guard for that same PR. The label can only be applied after the PR
    # exists, so a review can start before it lands; the title is set at
    # creation time and cannot race. release.yml pins the title literally.
    ignore_title_keywords:
      - "version packages"
