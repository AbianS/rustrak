<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1200px; height: 630px; overflow: hidden; }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #0c0c0c;
      padding: 56px 80px 52px;
      display: flex;
      flex-direction: column;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle glow near version (bottom-right) */
    .card::before {
      content: '';
      position: absolute;
      bottom: -60px;
      right: -30px;
      width: 720px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(197,241,30,0.055) 0%, transparent 55%);
      pointer-events: none;
    }

    /* Bottom accent line */
    .card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 80px;
      right: 80px;
      height: 1px;
      background: linear-gradient(to right,
        transparent,
        rgba(197,241,30,0.4) 15%,
        rgba(197,241,30,0.4) 85%,
        transparent
      );
    }

    /* ── Header: brand + release label ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo { width: 60px; height: 60px; flex-shrink: 0; }

    .brand-name {
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1.8px;
      line-height: 1;
    }

    .release-label {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: rgba(255,255,255,0.2);
    }

    /* ── Separator ── */
    .sep-line {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin-top: 32px;
      flex-shrink: 0;
    }

    /* ── Body: fills remaining height ── */
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 40px;
    }

    /* ── Tagline (top of body) ── */
    .tagline {
      font-size: 36px;
      font-weight: 400;
      color: rgba(255,255,255,0.28);
      line-height: 1.55;
      letter-spacing: -0.8px;
      max-width: 720px;
    }

    /* ── Bottom row: meta left + version right ── */
    .bottom-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px; /* align with version baseline */
    }

    .meta-item {
      font-family: 'Geist Mono', monospace;
      font-size: 11.5px;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.1px;
    }

    .meta-sep {
      width: 1px;
      height: 11px;
      background: rgba(255,255,255,0.1);
    }

    /* ── Version (hero) ── */
    .version-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .version {
      font-family: 'Geist Mono', monospace;
      font-size: 160px;
      font-weight: 700;
      line-height: 0.87;
      letter-spacing: -9px;
      color: #fff;
      white-space: nowrap;
    }

    .v { color: #C5F11E; font-weight: 400; }
  </style>
</head>
<body>
  <div class="card">

    <div class="header">
      <div class="brand">
        <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <rect width="512" height="512" rx="96" fill="#C5F11E"/>
          <polygon points="274,90 108,291 256,291 238,422 404,221 256,221" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Rustrak</span>
      </div>
      <span class="release-label">New Version</span>
    </div>

    <div class="sep-line"></div>

    <div class="body">
      <div class="tagline">
        Self-hosted error tracking.<br>
        Sentry SDK compatible.
      </div>

      <div class="bottom-row">
        <div class="meta">
          <span class="meta-item">github.com/AbianS/rustrak</span>
          <div class="meta-sep"></div>
          <span class="meta-item">Open Source</span>
        </div>
        <div class="version-block">
          <div class="version"><span class="v">v</span>{{VERSION}}</div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
