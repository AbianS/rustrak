[package]
name = "rustrak"
version = "0.1.0"
edition = "2021"
authors = ["Rustrak Team"]
description = "Ultra-lightweight error tracking server compatible with Sentry SDKs"
license = "GPL-3.0-only"

[dependencies]
# Web framework
actix-web = { version = "4.13.0", features = ["cookies"] }
actix-rt = "2.11.0"

# Session management
actix-session = { version = "0.11", features = ["cookie-session"] }

# Password hashing
argon2 = "0.5.3"

# Async runtime
tokio = { version = "1.52.3", features = ["full"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Logging
env_logger = "0.11.10"
log = "0.4.29"

# Environment
dotenvy = "0.15.7"

# Time
chrono = { version = "0.4.44", features = ["serde"] }

# Database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
    "migrate",
] }

# UUID generation
uuid = { version = "1.23.1", features = ["v4", "serde"] }

# Slug generation
slug = "0.1.6"

# Error handling
thiserror = "2.0.18"

# Random number generation for tokens
rand = "0.10.1"

# Hex encoding
hex = "0.4.3"

# Compression (for decompressing gzip/deflate/brotli payloads)
flate2 = "1.1.9"
brotli = "8.0.2"

# Async utilities
futures-util = "0.3.32"
bytes = "1.11.1"

# Hashing (for grouping key hash)
sha2 = "0.11.0"

# IP address handling (stored as string for SQLite compat)
# ipnetwork removed - store IP as String for multi-DB support

# CORS support
actix-cors = "0.7.1"

# Base64 encoding for pagination cursors
base64 = "0.22.1"

# HTTP client for notifications
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }

# HMAC for webhook signatures
hmac = "0.13.0"

# URL parsing/validation
url = "2.5.8"

# Async trait support
async-trait = "0.1.89"

# Email sending
lettre = { version = "0.11.22", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"] }

# OpenAPI spec generation (optional, behind `openapi` feature flag)
utoipa = { version = "5.5.0", features = ["actix_extras", "uuid", "chrono"], optional = true }
utoipa-scalar = { version = "0.3.0", features = ["actix-web"], optional = true }

[dev-dependencies]
# Test framework & fixtures
rstest = "0.26.1"
serial_test = "3.4.0"

# HTTP mocking for probe tests
mockito = "1.6"

# HTTP testing for actix-web
actix-test = "0.1.5"
# Note: reqwest available from main dependencies

# Database testing with real PostgreSQL containers
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

# Sentry SDK for E2E tests
sentry = { version = "0.48.2", features = ["test"] }

# Property-based testing
proptest = "1.11.0"

# Better assertion diffs
pretty_assertions = "1.4.1"

# Temp directories for tests
tempfile = "3.27.0"

[[bin]]
name = "rustrak"
path = "src/main.rs"

[[bin]]
name = "gen_openapi"
path = "src/bin/gen_openapi.rs"
required-features = ["openapi"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic = "abort" is intentionally disabled:
# actix-web uses catch_unwind per request to isolate handler panics and return HTTP 500.
# With panic = "abort", that safety net is silently bypassed and any panic kills the entire
# process — which is unacceptable for a server that must stay always on.
#panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[features]
default = ["sqlite"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
openapi = ["dep:utoipa", "dep:utoipa-scalar"]
