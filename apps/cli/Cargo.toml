[package]
name = "rustrak-cli"
version = "0.1.0"
edition = "2021"
description = "CLI client for Rustrak error tracking"
license = "GPL-3.0"

[[bin]]
name = "rustrak"
path = "src/main.rs"

[dependencies]
# HTTP client (must match progenitor-client's reqwest version)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# CLI framework
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Progenitor-generated client support
progenitor-client = "0.13"

# Types used by generated code
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }

# Config file
dirs = "6"
