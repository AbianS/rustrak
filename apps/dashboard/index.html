<!doctype html>
<!--
  No `data-theme`: dark is what the design system gives you with no attribute
  at all, and stamping `dark` here would only make the light theme's opt-out
  harder to reach later.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Rustrak</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
