[package]
name = "rustrak-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Benchmark suite for Rustrak server"
authors = ["Rustrak Team"]

[[bin]]
name = "rustrak-bench"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.52.3", features = ["full"] }

# HTTP client
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "gzip",
    "json",
] }

# CLI
clap = { version = "4.6.1", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

# Docker API for metrics
bollard = "0.21.0"

# Latency histograms
hdrhistogram = "7.5.4"

# Time handling
chrono = { version = "0.4.45", features = ["serde"] }

# UUID generation
uuid = { version = "1.23.4", features = ["v4"] }

# Compression
flate2 = "1.1.9"

# Async utilities
futures = "0.3.32"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.103"

# Colored output
colored = "3.1.1"

# Progress bars
indicatif = "0.18.6"

# Random number generation
rand = "0.10.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
