name: "Rust Security"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - "deny.toml"
  # No `branches` filter: it matches the PR's base, and a PR onto a feature
  # branch carries the same dependencies as one onto main.
  pull_request:
    paths:
      - "apps/server/**"
      - "deny.toml"
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday 04:00 UTC — catches new advisories
  workflow_dispatch:

jobs:
  cargo-deny:
    name: "cargo-deny (advisories + licenses)"
    # Skip the automated "chore: version packages" PR - see ci.yml.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
          arguments: --all-features
          manifest-path: apps/server/Cargo.toml

  cargo-audit:
    name: "cargo audit (RustSec)"
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet
      - name: Run cargo audit
        run: cargo audit
        working-directory: apps/server

  clippy:
    name: "clippy (security + correctness lints)"
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/server -> target"
      - name: Run clippy (postgres + openapi)
        run: cargo clippy --all-targets --no-default-features --features postgres,openapi -- -D warnings -W clippy::suspicious -W clippy::correctness
        working-directory: apps/server
      - name: Run clippy (sqlite)
        run: cargo clippy --all-targets --features sqlite,openapi -- -D warnings -W clippy::suspicious -W clippy::correctness
        working-directory: apps/server
