name: CI

on:
  # Every pull request, whatever it targets. Deliberately unfiltered: a `branches`
  # filter here matches the PR's *base*, so gating on `main` meant a stacked PR
  # or one onto a long-lived feature branch merged with no checks at all. The
  # work is the same work regardless of where it lands.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  ci:
    # Skip the automated "chore: version packages" PR. It only bumps versions and
    # writes changelogs, generated by changesets from commits that already passed
    # CI on main. A job skipped by `if` reports as successful to branch
    # protection, so required checks still go green. `head_ref` is empty on
    # non-PR events, so this never blocks anything else.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Rust setup + caching
      # sccache caches individual crate compilations; rust-cache caches the registry/index.
      # Both are complementary: sccache speeds up recompilation, rust-cache avoids re-downloading.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: apps/server -> target

      # Node setup + caching
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "latest"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm install` brings the `playwright` package but not the browser it
      # drives: the binary lands in ~/.cache/ms-playwright and is downloaded
      # separately. `@rustrak/ui` runs every story as a component test in a real
      # Chromium, so without this the whole suite fails at `browserType.launch`.
      # Cached on the lockfile, which is what pins the Playwright version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      # A no-op when the cache hit, and the download when it did not. `--with-deps`
      # also installs the system libraries Chromium needs on the runner.
      - run: pnpm --filter @rustrak/ui exec playwright install --with-deps chromium

      # Turbo runs test, build, lint, format:check in parallel
      - run: pnpm run ci

      # Fail the PR if apps/server/openapi.json is out of sync with the server code
      - name: Check OpenAPI spec is up to date
        run: |
          cargo run --manifest-path apps/server/Cargo.toml --bin gen_openapi --features openapi
          git diff --exit-code -- apps/server/openapi.json || \
            (echo "::error::openapi.json is out of date. Run: cd apps/server && cargo run --bin gen_openapi --features openapi" && exit 1)

  # The default build is SQLite, which happily masks Postgres-only breakage
  # (e.g. sqlx type_name/column-type mismatches only fail at decode time on
  # Postgres). The e2e suite runs migrations and the full ingest pipeline
  # against a real Postgres via testcontainers — the only suite that compiles
  # under the postgres feature.
  postgres-e2e:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: apps/server -> target
          key: postgres

      - name: Run Postgres e2e tests
        working-directory: apps/server
        run: cargo test --no-default-features --features postgres --test e2e_tests
